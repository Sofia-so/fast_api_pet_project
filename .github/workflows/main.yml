name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          TEST_DATABASE_URI: ${{ secrets.TEST_DATABASE_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python -m pytest
        
      - name: Build Docker image
        run: |
          docker build -t fast-api-pet-project .

      - name: Run Docker container
        run: |
          docker run -d \
            --name fast-api-pet-project \
            -p 8000:8000 \
            fast-api-pet-project

      - name: Check Docker container
        run: |
          sleep 5
          docker ps -a
          docker logs fast-api-pet-project
          test "$(docker inspect -f '{{.State.Running}}' fast-api-pet-project)" = "true"

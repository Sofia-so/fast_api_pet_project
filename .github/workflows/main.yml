name: Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:   

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URI: postgresql+psycopg://postgres:769011@localhost:5432/db_fast_api
          TEST_DATABASE_URI: postgresql+psycopg://postgres:769011@localhost:5432/test_db_fast_api
          SECRET_KEY: my_secret_key
          ADMIN_PASSWORD: storeadmin34
        run: |
          python -m pytest
